services:
  # Backend Service
  - type: web
    name: insightflow-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./insightflow.db
      - key: CORS_ORIGINS
        value: '["*"]'

  # Frontend Static Site
  - type: web
    name: insightflow-frontend
    env: static
    rootDir: frontend
    buildCommand: "sed -i 's|http://localhost:8000/api|'${VITE_API_URL}'|g' index.html && npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: insightflow-backend
          envVarKey: RENDER_EXTERNAL_URL
